on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "develop" ]
  schedule:
    - cron: '16 0 * * 1'
  # Allow manually re-running the required checks against a branch tip.
  # A GITHUB_TOKEN squash-merge does not re-trigger `push`, so the required
  # `static / Static CI Tests` context never lands on the post-merge develop
  # tip; workflow_dispatch lets the release pre-publish gate be satisfied.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    uses: nolte/gh-plumbing/.github/workflows/reusable-pre-commit.yaml@v1.1.25
  security:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    uses: nolte/gh-plumbing/.github/workflows/reusable-trivy.yaml@v1.1.25
  chain-bench:
    uses: nolte/gh-plumbing/.github/workflows/reusable-chain-bench.yaml@v1.1.25
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
